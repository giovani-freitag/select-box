<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Without this a mobile-emulated run lays out at 980px and wide,
             so a narrow-viewport spec would never see a narrow layout. -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>webcomponents fixture</title>
        <style>
            /* Controls sit above the mount: an open popover is absolutely
               positioned and would otherwise cover them, so a spec could not
               click them. */
            .controls {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            #mount {
                width: 320px;
            }

            /* A positioned neighbour after the component: without it, the
               popover would paint on top from `position: absolute` alone and
               the paint-order spec could never fail. */
            .overlap {
                position: relative;
                height: 300px;
                margin-top: 0.5rem;
                background: #fde68a;
            }

            body {
                margin: 1rem;
                font-family: system-ui, sans-serif;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>webcomponents</h1>
            <div class="controls">
                <button id="destroy" type="button">destroy</button>
                <button id="toggle-surface" type="button">toggle surface</button>
                <output id="last-change"></output>
            </div>
            <form id="host-form">
                <div id="mount"></div>
                <button id="reset" type="reset">reset</button>
                <button id="submit" type="submit">submit</button>
            </form>
            <div class="overlap" data-overlap>positioned neighbour</div>
        </main>
        <script type="module" src="/fixtures/webcomponents.ts"></script>
    </body>
</html>
