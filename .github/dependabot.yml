version: 2

updates:
  # `increase` rather than the npm default `widen`: these are published
  # packages with pinned versions, and widening a range would leave the
  # lockfile as the only record of what was tested.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    # A buffer against a freshly-compromised release. Version updates only —
    # a security fix is never delayed by it.
    cooldown:
      default-days: 7
    # `@select-box/webcomponents` holds happy-dom at an exact version because
    # every release from 20.3.3 on livelocks its suite. Without this, the same
    # broken bump is proposed every week.
    ignore:
      - dependency-name: "happy-dom"
        versions: [">20.3.2"]
    # Minor and patch only. A single breaking major otherwise holds the whole
    # group hostage, security patches included; majors arrive as their own PRs
    # so one can be triaged without blocking the rest.
    groups:
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # `package-ecosystem` takes one string, so keeping the workflow actions
  # current needs its own entry rather than another pattern.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
