name: Release

on:
  push:
    branches:
      - main
      # Glob, not regex. Beta lines are maintained as 0.<minor>.x; the pattern
      # costs nothing until such a branch exists.
      - "0.*.x"
  workflow_dispatch:

# release-please opens and updates the release PR, then cuts the tag and the
# GitHub release when that PR merges. Both need write access.
permissions:
  contents: write
  pull-requests: write

# Two runs racing on the same release PR leave it half-updated, and a superseded
# run has nothing useful to say, so the newer one waits rather than cancels.
concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Keep the release PR current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release-pr-branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without this, a run on a maintenance branch would still release
          # against the default branch.
          target-branch: ${{ github.ref_name }}

  # A pull request opened with GITHUB_TOKEN cannot trigger `pull_request`
  # workflows: GitHub drops the event to stop a workflow feeding itself.
  # `repository_dispatch` is the one event exempt from that guard, so the
  # release PR's checks are summoned explicitly instead of triggered.
  summon-release-checks:
    name: Summon the release PR checks
    needs: release-please
    if: needs.release-please.outputs.release-pr-branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: verify-release-pr
          client-payload: |
            { "ref": "${{ needs.release-please.outputs.release-pr-branch }}" }

  # Same escape hatch as the PR checks: a release cut with GITHUB_TOKEN raises no
  # event a workflow can listen for, so the publish is summoned explicitly.
  summon-publish:
    name: Summon the publish
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ github.token }}
          event-type: publish-release
          client-payload: |
            { "tag": "${{ needs.release-please.outputs.tag }}" }
