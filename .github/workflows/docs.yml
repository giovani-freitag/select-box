name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-starlight/**"
      - "packages/**"
      - "tooling/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Publishing to Pages needs these two; nothing else in the repo does, so they
# stay scoped to this workflow rather than the whole file.
permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is pointless, but cancelling one mid-upload leaves the
# environment locked, so a running publish is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Through turbo, not pnpm's own filter: the site's TypeDoc pass reads the
      # packages' built type declarations, so their builds have to run first.
      - name: Build the site
        run: pnpm exec turbo run build --filter=@select-box/docs-starlight

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-starlight/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
